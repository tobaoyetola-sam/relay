apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relay
  namespace: relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relay
  # 3 so one pod lost (node, zone, rollout) never leaves a single pod.
  minReplicas: 3
  # Capped by the DB connection budget, see configmap.yaml.
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
