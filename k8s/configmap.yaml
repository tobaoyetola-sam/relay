apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
  namespace: relay
data:
  PORT: "8080"
  # Connection budget. The managed Postgres caps max_connections at 100 and
  # that is not changing this quarter.
  #   HPA maxReplicas (10) x PG_POOL_MAX (8)    = 80
  #   + rollout surge (1 pod x 8)               = 88
  #   + migrator (1)                            = 89
  # leaves ~10 for the data team's own tooling and superuser slots.
  # If you raise maxReplicas or the pool, redo this sum.
  PG_POOL_MAX: "8"
