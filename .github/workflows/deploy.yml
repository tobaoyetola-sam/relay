name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPO: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/relay

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Syntax check
        run: for f in app/src/*.js; do node --check "$f"; done
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: app
      - name: Docker build
        run: docker build -t relay:ci app
      # Offline schema validation. `kubectl apply --dry-run=client` still
      # needs a live API server for its schema, which CI does not have.
      - name: Manifests are valid
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -summary k8s/
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        working-directory: terraform
        run: terraform init -backend=false && terraform validate

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Protected environment: add required reviewers in repo settings.
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC, no long-lived AWS keys in repo secrets
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Immutable tag per commit. `latest` + `rollout restart` made it
      # impossible to tell what was running or to roll back.
      - name: Build and push
        run: |
          docker build -t "$ECR_REPO:$GITHUB_SHA" app
          docker push "$ECR_REPO:$GITHUB_SHA"

      # Only the app's manifests. k8s/postgres.yaml and k8s/secret.yaml are
      # LOCAL stand-ins: applying them (as `kubectl apply -f k8s/` did) would
      # start a throwaway Postgres in prod and point relay at it.
      # The prod relay-secrets must come from Secrets Manager (see NOTES.md).
      - name: Deploy
        id: deploy
        run: |
          aws eks update-kubeconfig --name relay-prod
          mkdir -p out
          sed "s#image: relay:latest#image: $ECR_REPO:$GITHUB_SHA#" k8s/deployment.yaml > out/deployment.yaml
          kubectl apply \
            -f k8s/00-namespace.yaml \
            -f k8s/configmap.yaml \
            -f k8s/service.yaml \
            -f k8s/pdb.yaml \
            -f k8s/hpa.yaml \
            -f out/deployment.yaml
          kubectl -n relay rollout status deployment/relay --timeout=5m

      - name: Roll back on failure
        # Only if the rollout itself failed, never for a failed build.
        if: failure() && steps.deploy.outcome == 'failure'
        run: kubectl -n relay rollout undo deployment/relay
